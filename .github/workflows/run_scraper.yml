name: Auto Generate XML

on:
  schedule:
    # প্রতি ১২ ঘণ্টা পর পর অটোমেটিক রান হবে (টাইম পরিবর্তন করতে পারেন)
    - cron: '0 */12 * * *'
  workflow_dispatch: # এর মাধ্যমে আপনি চাইলে গিটহাবে ঢুকে ম্যানুয়ালিও রান করতে পারবেন

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Data
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System and Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Scraper Script
      run: |
        python trendyporn_direct_xml.py

    - name: Commit and Push Generated XML to Repository
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        
        # ফাইলটি তৈরি হয়েছে কিনা চেক করে গিটহাবে পুশ করবে
        if [ -f trendyporn.xml ]; then
          git add trendyporn.xml
          git commit -m "Auto-updated trendyporn.xml [$(date -u +'%Y-%m-%d %H:%M:%S') UTC]" || exit 0
          git push
        else
          echo "Error: XML file was not generated by script."
          exit 1
        fi
